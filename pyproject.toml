[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daem0nmcp"
version = "7.0.0.dev0"
description = "AI Memory & Decision System - Give AI agents persistent memory and consistent decision-making"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Daem0nMCP"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp==3.4.7",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",  # Required for SQLAlchemy async
    "pydantic-settings>=2.0.0",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
tasks = [
    "fastmcp[tasks]==3.4.7",
]
local = [
    "qdrant-client>=1.7.0",
    "rank-bm25>=0.2.2",
]
graph = [
    "networkx>=3.0",
    "leidenalg>=0.10.0",
    "python-igraph>=0.11.0",
    "langgraph>=1.0.7",
    "langgraph-checkpoint-sqlite>=3.0.3",
]
apps = [
    "httpx>=0.28.1,<0.29",
    "httpcore>=1.0.9,<1.1",
    "packaging>=24.0",
    "beautifulsoup4>=4.12.0",
    "watchdog>=3.0.0",
    "plyer>=2.1.0",
    "tree-sitter-language-pack>=0.13.0",
]
models-local = [
    # Secure ONNX runtime wheels start at CPython 3.11.
    "sentence-transformers[onnx]>=3.2.0; python_version >= '3.11'",
    "onnxruntime>=1.24.1; python_version >= '3.11'",
    "numpy>=1.24.0; python_version >= '3.11'",
    "llmlingua>=0.2.2; python_version >= '3.11'",
]
models-hosted = [
    "tiktoken>=0.5.0",
]
agency-e2b = [
    "e2b-code-interpreter==2.10.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.16.8",  # keep in sync with ci.yml and .pre-commit-config.yaml
    "mypy==2.3.1",  # keep in sync with ci.yml and .pre-commit-config.yaml
    "pre-commit>=3.0.0",
]

# Compatibility alias retained for existing tracing-enabled installations.
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[project.scripts]
daem0nmcp = "daem0nmcp.server:main"

[project.urls]
Homepage = "https://github.com/DasBluEyedDevil/Daem0n-MCP"
Repository = "https://github.com/DasBluEyedDevil/Daem0n-MCP"

[tool.setuptools.packages.find]
where = ["."]
include = ["daem0nmcp*"]

[tool.setuptools.package-data]
"daem0nmcp.ui" = [
    "templates/app.html",
    "static/*.css",
    "static/*.js",
    "static/renderers/*.js",
]
"daem0nmcp.opencode_assets" = ["*.ts", "commands/*.md"]

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.format]
exclude = ["tests/fixtures/retrieval/qdrant_fake.py"] # Frozen, checksum-verified fixture.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

